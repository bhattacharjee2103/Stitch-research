[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stitch-ar-research"
version = "0.1.0"
description = "Reproducible appearance-change retrieval and planar AR anchoring"
requires-python = ">=3.9"

[project.scripts]
stitch = "stitch.cli:main"
stitch-app = "stitch.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
